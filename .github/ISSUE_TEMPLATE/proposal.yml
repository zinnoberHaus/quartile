name: Feature, research, or maintenance proposal
description: Define a user outcome and how we will verify it
labels: ["status:triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of work
      options: [Feature, Documentation, Research, Maintenance]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome and evidence of need
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable completion and how it will be verified.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and alternatives
  - type: textarea
    id: operations
    attributes:
      label: Security, deployment, and documentation effects
