version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native port; tsup's declaration build uses the TypeScript 5 JS API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node typings follow the Node version in .nvmrc, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
