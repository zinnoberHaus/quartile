name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @quartile/react test:package
      - name: Verify dataframe export and model backend examples
        run: |
          python3 -m unittest discover -s examples/python -p 'test_*.py'
          node --test examples/ai-server/server.test.mjs
      - name: Install browser for integration verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify linked queries in a production browser build
        run: |
          pnpm --filter @quartile/gallery preview --host 127.0.0.1 --port 4178 --strictPort > /tmp/quartile-preview.log 2>&1 &
          quartile_preview_pid=$!
          trap 'kill "$quartile_preview_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          node apps/gallery/src/examples/scale/verify.mjs http://127.0.0.1:4178 /tmp/quartile-browser-evidence
          node apps/gallery/src/examples/workbench/verify.mjs http://127.0.0.1:4178 /tmp/quartile-browser-evidence/workbench
          node apps/gallery/src/examples/formatting/verify.mjs http://127.0.0.1:4178 /tmp/quartile-browser-evidence/formatting
          node apps/gallery/src/examples/science/verify.mjs http://127.0.0.1:4178 /tmp/quartile-browser-evidence/science
          QUARTILE_NAV_BASE_URL=http://127.0.0.1:4178 node apps/gallery/src/shell/verify-navigation.mjs
          node apps/gallery/src/examples/studio/verify.mjs http://127.0.0.1:4178 /tmp/quartile-browser-evidence/studio
          node apps/gallery/scripts/verify-starter.mjs /tmp/quartile-browser-evidence/studio/quartile-react-starter.zip
          node apps/gallery/scripts/verify-starter.mjs /tmp/quartile-browser-evidence/studio/quartile-custom-starter.zip
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            /tmp/quartile-browser-evidence
            /tmp/quartile-preview.log
          if-no-files-found: ignore
