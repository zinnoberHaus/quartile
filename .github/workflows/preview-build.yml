name: Preview build
# Attaches an installable preview build to a GitHub pre-release. This is not the 0.1.0 release and
# does not publish to npm (see docs/decisions/0001 and 0008). Run it by hand from a commit on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pre-release tag to create, for example v0.1.0-preview.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Accept only preview tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$'; then
            echo "::error::The tag must look like v0.1.0-preview.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build, pack and verify the package
        run: |
          pnpm build:lib
          pnpm --filter @quartile/react test:package
      - name: Collect the files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts pack
          pnpm --dir packages/react pack --pack-destination "$PWD/pack"
          cp pack/*.tgz "artifacts/quartile-react-${TAG#v}.tgz"
          cp packages/react/dist/embed/quartile.global.js packages/react/dist/embed/quartile.js artifacts/
          (cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          A preview build of \`@quartile/react\` from commit ${GITHUB_SHA}. It is not the 0.1.0 release and is not published to npm; the API and the block language may change.

          **Install in a React project**

          \`\`\`sh
          npm install ${base}/quartile-react-${TAG#v}.tgz
          \`\`\`

          The import name is \`@quartile/react\`. React 18.2 or newer is a peer dependency.

          **Use on any HTML page**

          Download \`quartile.global.js\`, serve it from your own site and add \`<script src="/assets/quartile.global.js" data-theme="auto"></script>\`. \`quartile.js\` is the same build as an ES module.

          \`SHA256SUMS.txt\` lists the checksum of each file. Documentation: https://docs.usequartile.com
          EOF
          gh release create "$TAG" artifacts/* --prerelease --target "$GITHUB_SHA" \
            --title "Preview build ${TAG#v}" --notes-file notes.md
